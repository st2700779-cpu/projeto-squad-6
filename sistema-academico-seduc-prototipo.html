<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Sistema Acadêmico · SEDUC/SE</title>
<!-- Protótipo em arquivo único, no visual dos wireframes (W1, W2, W5, W13, W14).
     Usa o mesmo tema e os mesmos componentes do portal (assets/css). Abre direto, sem servidor. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/css/tema.css">
<link rel="stylesheet" href="assets/css/componentes.css">
<script src="assets/js/tema-inicial.js"></script>
<style>
  /* Complementos deste protótipo (o resto vem de componentes.css). O portal recebe estas duas
     regras do Bootstrap; aqui, sem Bootstrap, elas vêm declaradas. */
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  .linha-entre { display: flex; justify-content: space-between; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .lista-cartao { list-style: none; padding: 0; margin: 0; }
  .lista-cartao li { display: flex; align-items: center; gap: .8rem; padding: .8rem 0; border-bottom: 1px solid var(--linha-suave); }
  .lista-cartao li:last-child { border-bottom: 0; }
  .lista-cartao .nome { flex: 1; min-width: 0; font-size: 1.05rem; }
  .chamada-botoes { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; width: 100%; }
  .chamada-botoes .botao { min-height: 48px; }
  @media (min-width: 560px) { .chamada-botoes { width: auto; } .lista-cartao.chamada li { flex-wrap: nowrap; } }
  .lista-cartao.chamada li { flex-wrap: wrap; }
  .nota-entrada { width: 96px; flex: none; text-align: right; }
  .icone-atividade { width: 48px; height: 48px; border-radius: 12px; background: var(--tinta); color: var(--sobre-tinta); display: grid; place-items: center; flex: none; }
  .relatorio { text-align: left; }
  .rodape-prototipo { color: var(--suave); font-size: .9rem; margin-top: 2rem; }
</style>
</head>
<body>
<a class="sr-only" href="#conteudo">Pular para o conteúdo</a>

<header class="topo">
  <div class="topo-interno" style="max-width:620px">
    <a class="marca" href="#" data-ir="">Portal Acadêmico<span id="marca-perfil" class="so-desktop"></span></a>
    <button type="button" class="ferramenta" data-escala="-0.1" aria-label="Diminuir letra" id="btn-menos">A−</button>
    <button type="button" class="ferramenta" data-escala="0.1" aria-label="Aumentar letra">A+</button>
    <span id="lugar-tema"></span>
    <a class="ferramenta" href="#" data-ir="" id="btn-sair" hidden>Sair</a>
  </div>
</header>

<main id="conteudo" class="conteudo conteudo-estreito" tabindex="-1"></main>

<script>
(function () {
  'use strict';

  // Botão de modo escuro (assets/js/tema-inicial.js, o mesmo do portal).
  var lugarTema = document.getElementById('lugar-tema');
  if (lugarTema && window.botaoTema) lugarTema.outerHTML = window.botaoTema();

  // ---------- Utilitários ----------
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var num = function (n) { return Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); };
  var PATHS = {
    usuario: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',
    livro: 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5M9 7h6',
    escola: 'M2 10l10-5 10 5-10 5zM6 12v5c3.5 2.5 8.5 2.5 12 0v-5',
    calendario: 'M4 6h16v15H4zM4 10h16M8 3v4M16 3v4',
    formulario: 'M9 3h6v3H9zM7 5H5v16h14V5h-2M8 11h8M8 15h5',
    documento: 'M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h6',
    alto: 'M4 9v6h4l5 4V5L8 9zM16 9a3 3 0 0 1 0 6M18.5 6.5a7 7 0 0 1 0 11',
    alerta: 'M12 3l10 18H2zM12 10v4M12 17.5v.5',
    ok: 'M5 12l5 5 9-10',
    grade: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z'
  };
  var icone = function (nome, tam) {
    tam = tam || 22;
    return '<svg width="' + tam + '" height="' + tam + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" style="flex:none"><path d="' + PATHS[nome] + '"/></svg>';
  };
  var etiqueta = function (texto, tipo) { return '<span class="etiqueta etiqueta-' + tipo + '">' + esc(texto) + '</span>'; };

  // Preferência de tamanho de letra (só conveniência; funciona sem armazenamento).
  function lerEscala() { try { return Number(localStorage.getItem('prototipo-escala')) || 1; } catch (e) { return 1; } }
  function aplicarEscala(v) {
    document.documentElement.style.setProperty('--escala', v);
    try { localStorage.setItem('prototipo-escala', v); } catch (e) { /* segue sem guardar */ }
  }
  var escala = lerEscala();
  aplicarEscala(escala);

  // Leitura em voz alta (botão Ouvir dos wireframes).
  var podeLer = 'speechSynthesis' in window;
  function botaoOuvir(texto, rotulo) {
    if (!podeLer) return '';
    var so = !rotulo;
    return '<button type="button" class="botao-ouvir' + (so ? ' so-icone' : '') + '" data-ouvir="' + esc(texto) + '" aria-label="Ouvir em voz alta">' + icone('alto', 20) + (so ? '' : '<span>' + esc(rotulo) + '</span>') + '</button>';
  }
  function ler(texto) {
    speechSynthesis.cancel();
    var fala = new SpeechSynthesisUtterance(texto);
    fala.lang = 'pt-BR';
    fala.rate = 0.95;
    speechSynthesis.speak(fala);
  }

  var timerAviso;
  function avisar(texto) {
    var el = document.getElementById('aviso-rapido');
    if (!el) {
      el = document.createElement('div');
      el.id = 'aviso-rapido';
      el.className = 'aviso-rapido';
      el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    el.textContent = texto;
    el.hidden = false;
    clearTimeout(timerAviso);
    timerAviso = setTimeout(function () { el.hidden = true; }, 3500);
  }

  // ---------- Dados simulados ----------
  var ESCOLA = 'E. E. Prof. Ivo do Prado';
  var boletim = [
    { disciplina: 'Língua Portuguesa', nota: 8.5, frequencia: 96, situacao: 'aprovado' },
    { disciplina: 'Matemática', nota: 7.0, frequencia: 92, situacao: 'aprovado' },
    { disciplina: 'Ciências', nota: 9.0, frequencia: 98, situacao: 'aprovado' },
    { disciplina: 'História', nota: 8.0, frequencia: 90, situacao: 'aprovado' },
    { disciplina: 'Geografia', nota: 6.5, frequencia: 88, situacao: 'pendente' },
    { disciplina: 'Educação Física', nota: 9.5, frequencia: 100, situacao: 'aprovado' }
  ];
  var atividades = [
    { titulo: 'Avaliação de Matemática — Frações', data: 'Segunda-feira, 24/08', icone: 'formulario' },
    { titulo: 'Reunião de pais e mestres', data: 'Sexta-feira, 28/08, 18h', icone: 'calendario' }
  ];
  var alunosTurma = [
    { id: 1, nome: 'Beatriz Nunes Lima', presente: true, nota: '' },
    { id: 2, nome: 'Caio Santos Ferreira', presente: true, nota: '' },
    { id: 3, nome: 'Davi Melo Oliveira', presente: false, nota: '' },
    { id: 4, nome: 'Emanuelly Rocha Dias', presente: true, nota: '' },
    { id: 5, nome: 'Felipe Andrade Souza', presente: false, nota: '' },
    { id: 6, nome: 'Giovanna Prado Cruz', presente: true, nota: '' }
  ];
  var aulas = [
    ['Hoje · 24/08', '9º Ano B — Frações, 2 aulas'],
    ['Amanhã · 25/08', '7º Ano A — Equações, 1 aula'],
    ['Quarta · 26/08', '9º Ano B — Avaliação, 2 aulas']
  ];
  var filaMatricula = [
    { id: 1, nome: 'Heitor Batista Rocha', responsavel: 'Rita Batista', tipo: 'Matrícula nova', serie: '6º ano', protocolo: 'MAT-2026-0011', status: 'Aguardando confirmação' },
    { id: 2, nome: 'Isabela Farias Melo', responsavel: 'Júlio Melo', tipo: 'Transferência', serie: '1ª série EM', protocolo: 'MAT-2026-0012', status: 'Aguardando confirmação' },
    { id: 3, nome: 'João Pedro Vieira', responsavel: 'Sandra Vieira', tipo: 'Matrícula nova', serie: '9º ano', protocolo: 'MAT-2026-0013', status: 'Aguardando confirmação' },
    { id: 4, nome: 'Larissa Cavalcante', responsavel: 'Paulo Cavalcante', tipo: 'Transferência', serie: '7º ano', protocolo: 'MAT-2026-0014', status: 'Aguardando confirmação' }
  ];
  var PRESENCA_MINIMA = 75;

  // Estado das telas
  var filtro = 'Aguardando confirmação';
  var recusando = null;
  var erroRecusa = '';
  var erroNotas = null; // { id, texto }

  var main = document.getElementById('conteudo');
  var PERFIS = {
    aluno: { nome: 'Família e estudante', desc: 'Matrícula, notas e avisos', icone: 'usuario', rotulo: 'Família' },
    professor: { nome: 'Professor', desc: 'Turmas e diário', icone: 'livro', rotulo: 'Professor' },
    secretaria: { nome: 'Escola', desc: 'Secretaria, coordenação e direção', icone: 'escola', rotulo: 'Escola' }
  };

  // ---------- W1 · Seleção de perfil ----------
  function telaPerfis() {
    return '<h1 style="font-size:clamp(2rem,6vw,2.6rem);margin-top:.8rem">Quem está usando o portal?</h1>' +
      '<p class="texto-suave" style="font-size:1.1rem">Escolha seu perfil. No protótipo, o acesso é simulado.</p>' +
      Object.keys(PERFIS).map(function (k) {
        var p = PERFIS[k];
        return '<div class="bloco"><a href="#' + k + '"><span class="icone">' + icone(p.icone, 30) + '</span><span><strong>' + p.nome + '</strong><small>' + p.desc + '</small></span></a>' + botaoOuvir(p.nome + '. ' + p.desc + '.') + '</div>';
      }).join('') +
      '<p class="rodape-prototipo">Protótipo de demonstração · SEDUC/SE · dados fictícios.</p>';
  }

  // ---------- W2 + W5 · Família: notas e faltas ----------
  function telaAluno() {
    var freq = Math.round(boletim.reduce(function (s, b) { return s + b.frequencia; }, 0) / boletim.length);
    var atencao = boletim.filter(function (b) { return b.situacao !== 'aprovado'; }).map(function (b) { return b.disciplina; });
    var resumo = 'A presença de Ana está em ' + freq + ' por cento. O mínimo é ' + PRESENCA_MINIMA + ' por cento. ' +
      (atencao.length ? 'Precisa de atenção em: ' + atencao.join(', ') + '.' : 'A média está boa em todas as matérias.');
    return '<h1 style="margin-top:.4rem">Olá! Veja como a Ana está indo</h1>' +
      '<div class="estudante"><span class="avatar" aria-hidden="true">A</span><div><strong style="font-size:1.1rem">Ana Beatriz Costa</strong><br><span class="texto-suave">9º Ano B · ' + ESCOLA + '</span></div></div>' +
      '<div class="cartao" style="padding:1.2rem 1.4rem">' +
        '<div class="linha-entre"><strong style="font-size:1.15rem">Presença nas aulas</strong>' + botaoOuvir(resumo, 'Resumo') + '</div>' +
        '<p style="font-size:2.6rem;font-weight:700;margin:.2rem 0 0;line-height:1.2">' + freq + '%</p>' +
        '<p class="texto-suave" style="margin:0 0 .6rem">Mínimo para passar de ano: ' + PRESENCA_MINIMA + '%</p>' +
        '<div class="barra" role="img" aria-label="Presença de ' + freq + ' por cento; mínimo de ' + PRESENCA_MINIMA + '"><span style="width:' + freq + '%"></span><i class="marca-minimo" style="left:' + PRESENCA_MINIMA + '%"></i></div>' +
      '</div>' +
      '<h2>Boletim · 2º trimestre</h2>' +
      '<div class="materias-cabecalho" aria-hidden="true"><span>Matéria</span><span style="text-align:right">Nota</span><span>Situação</span></div>' +
      '<div class="materias" role="list" aria-label="Notas por matéria">' +
        boletim.map(function (b) {
          var ok = b.situacao === 'aprovado';
          return '<details class="materia" role="listitem"><summary><span>' + esc(b.disciplina) + '</span><strong><span class="sr-only">nota </span>' + num(b.nota) + '</strong>' +
            (ok ? etiqueta('Indo bem', 'ok') : etiqueta('Precisa de atenção', 'atencao')) + '</summary>' +
            '<div class="unidades"><span>Frequência: <strong style="color:var(--tinta)">' + b.frequencia + '%</strong></span><span>' + (ok ? 'Aprovado' : 'Em recuperação') + '</span></div></details>';
        }).join('') +
      '</div>' +
      '<p class="texto-suave" style="margin-top:1rem">Toque em uma matéria para ver a frequência.</p>' +
      '<h2>Próximas atividades</h2>' +
      atividades.map(function (a) {
        return '<div class="cartao linha-entre" style="flex-wrap:nowrap"><span class="icone-atividade">' + icone(a.icone, 24) + '</span><div style="flex:1;min-width:0"><strong>' + esc(a.titulo) + '</strong><br><span class="texto-suave">' + esc(a.data) + '</span></div>' + botaoOuvir(a.titulo + ', ' + a.data) + '</div>';
      }).join('') +
      '<h2>Documentos</h2>' +
      '<div class="cartao"><p style="margin-top:0">Peça documentos escolares diretamente à secretaria.</p>' +
        '<button type="button" class="botao botao-grande botao-largo" id="btn-historico">' + icone('documento', 22) + 'Solicitar histórico escolar</button></div>';
  }

  // ---------- W13 · Professor: diário de classe ----------
  function mediaTurma() {
    var notas = alunosTurma.filter(function (a) { return a.nota !== ''; }).map(function (a) { return Number(String(a.nota).replace(',', '.')); });
    return notas.length ? num(notas.reduce(function (s, n) { return s + n; }, 0) / notas.length) : '7,4';
  }
  function telaProfessor() {
    var presentes = alunosTurma.filter(function (a) { return a.presente; }).length;
    return '<h1 style="margin-bottom:.2rem">Diário de classe</h1>' +
      '<p class="texto-suave" style="margin-top:0">' + ESCOLA + ' · Matemática · 9º Ano B · aula de 24/08</p>' +
      '<div class="numeros">' +
        '<div class="numero"><strong>' + alunosTurma.length + '</strong><span>estudantes na turma</span></div>' +
        '<div class="numero"><strong>' + presentes + '</strong><span>presentes hoje</span></div>' +
        '<div class="numero' + (alunosTurma.length - presentes ? ' alerta' : '') + '"><strong>' + (alunosTurma.length - presentes) + '</strong><span>ausentes hoje</span></div>' +
        '<div class="numero"><strong>' + mediaTurma() + '</strong><span>média da turma</span></div>' +
      '</div>' +
      '<h2>Chamada</h2>' +
      '<div class="cartao"><ul class="lista-cartao chamada">' +
        alunosTurma.map(function (a) {
          return '<li><span class="nome">' + esc(a.nome) + '</span><span class="chamada-botoes" role="group" aria-label="Frequência de ' + esc(a.nome) + '">' +
            '<button type="button" class="botao ' + (a.presente ? '' : 'botao-secundario') + '" data-presenca="' + a.id + '" data-valor="1" aria-pressed="' + a.presente + '">Presente</button>' +
            '<button type="button" class="botao ' + (a.presente ? 'botao-secundario' : 'botao-perigo') + '" data-presenca="' + a.id + '" data-valor="0" aria-pressed="' + !a.presente + '">Ausente</button></span></li>';
        }).join('') +
      '</ul></div>' +
      '<button type="button" class="botao botao-largo" id="btn-frequencia">' + icone('ok', 20) + 'Salvar frequência</button>' +
      '<h2>Lançar notas · 2º trimestre</h2>' +
      '<div class="cartao"><ul class="lista-cartao">' +
        alunosTurma.map(function (a) {
          var invalido = erroNotas && erroNotas.id === a.id;
          return '<li><label class="nome" for="nota-' + a.id + '">' + esc(a.nome) + '</label><input id="nota-' + a.id + '" class="entrada nota-entrada" inputmode="decimal" placeholder="0,0" data-nota="' + a.id + '" value="' + esc(a.nota) + '"' + (invalido ? ' aria-invalid="true" aria-describedby="erro-notas"' : '') + '></li>';
        }).join('') +
      '</ul></div>' +
      '<div id="erro-notas" role="alert">' + (erroNotas ? '<p class="alerta-erro">' + icone('alerta', 20) + '<span>' + esc(erroNotas.texto) + '</span></p>' : '') + '</div>' +
      '<div class="linha-botoes" style="margin-top:.6rem"><button type="button" class="botao" id="btn-notas">' + icone('ok', 20) + 'Salvar notas</button><span class="texto-suave">As notas salvas aparecem para a família.</span></div>' +
      '<h2>Calendário de aulas</h2>' +
      aulas.map(function (x) { return '<div class="cartao"><span class="texto-suave" style="font-size:.9rem;font-weight:700">' + esc(x[0]) + '</span><br><strong>' + esc(x[1]) + '</strong></div>'; }).join('');
  }

  // ---------- W14 · Escola: pedidos de matrícula ----------
  function painelRecusa(p) {
    return '<div class="painel-inline" role="group" aria-labelledby="recusa-titulo">' +
      '<h2 id="recusa-titulo">Recusar matrícula de ' + esc(p.nome) + '</h2>' +
      '<div class="campo" style="margin:0"><label for="motivo">Motivo <span class="dica">(obrigatório; a família verá este texto)</span></label>' +
      '<textarea id="motivo" class="entrada" aria-describedby="motivo-erro"' + (erroRecusa ? ' aria-invalid="true"' : '') + '></textarea>' +
      '<p id="motivo-erro" class="erro">' + esc(erroRecusa) + '</p></div>' +
      '<div class="linha-botoes" style="justify-content:flex-end;margin-top:.7rem"><button type="button" class="botao botao-secundario" data-cancelar-recusa>Cancelar</button><button type="button" class="botao" data-confirmar-recusa="' + p.id + '">Confirmar recusa</button></div></div>';
  }
  function telaSecretaria() {
    var abas = ['Aguardando confirmação', 'Confirmada', 'Recusada'];
    var nomes = { 'Aguardando confirmação': 'Aguardando', Confirmada: 'Confirmadas', Recusada: 'Recusadas' };
    var lista = filaMatricula.filter(function (p) { return p.status === filtro; });
    return '<h1>Pedidos de matrícula</h1>' +
      '<div class="filtros" role="group" aria-label="Filtrar por situação">' +
        abas.map(function (a) { var n = filaMatricula.filter(function (p) { return p.status === a; }).length; return '<button type="button" data-filtro="' + a + '" aria-pressed="' + (a === filtro) + '">' + nomes[a] + (n ? ' (' + n + ')' : '') + '</button>'; }).join('') +
      '</div>' +
      (lista.length ? lista.map(function (p) {
        var tipo = p.status === 'Confirmada' ? 'ok' : p.status === 'Recusada' ? 'erro' : 'atencao';
        return '<div class="cartao"><strong style="font-size:1.1rem">' + esc(p.nome) + '</strong><br>' +
          '<span class="texto-suave" style="font-size:.92rem">' + esc(p.tipo) + ' · ' + esc(p.serie) + ' · Responsável: ' + esc(p.responsavel) + ' · ' + esc(p.protocolo) + '</span>' +
          (p.motivo ? '<p style="margin:.4rem 0 0">Motivo: ' + esc(p.motivo) + '</p>' : '') +
          '<div style="margin-top:.6rem">' + etiqueta(p.status, tipo) + '</div>' +
          (p.status === 'Aguardando confirmação' ? '<div class="chamada-botoes" style="margin-top:.8rem"><button type="button" class="botao" data-confirmar="' + p.id + '">Confirmar</button><button type="button" class="botao botao-secundario" data-recusar="' + p.id + '" aria-expanded="' + (recusando === p.id) + '">Recusar</button></div>' : '') +
          '</div>' + (recusando === p.id ? painelRecusa(p) : '');
      }).join('') : '<p class="vazio">Nenhum pedido nesta situação.</p>') +
      '<h2>Painel da escola</h2>' +
      '<div class="numeros"><div class="numero"><strong>1.284</strong><span>estudantes matriculados</span></div><div class="numero"><strong>87</strong><span>professores ativos</span></div><div class="numero"><strong>42</strong><span>turmas ativas</span></div><div class="numero"><strong>91%</strong><span>taxa de aprovação</span></div></div>' +
      '<h2>Relatórios</h2>' +
      '<div class="opcoes">' +
        [['Boletim consolidado', 'documento'], ['Histórico escolar', 'livro'], ['Censo Escolar (Educacenso)', 'grade']].map(function (r) {
          return '<button type="button" class="opcao relatorio" data-relatorio="' + esc(r[0]) + '">' + icone(r[1], 26) + '<span>' + esc(r[0]) + '<small>Gerar e baixar</small></span></button>';
        }).join('') +
      '</div>';
  }

  // ---------- Roteamento por endereço (#aluno, #professor, #secretaria) ----------
  var perfilAtual = '';
  function desenhar(focar) {
    var perfil = location.hash.slice(1);
    if (!PERFIS[perfil]) perfil = '';
    if (perfil !== perfilAtual) { filtro = 'Aguardando confirmação'; recusando = null; erroRecusa = ''; erroNotas = null; }
    perfilAtual = perfil;
    document.getElementById('btn-sair').hidden = !perfil;
    document.getElementById('btn-menos').hidden = !!perfil; // W2: no perfil, só A+ e Sair
    document.getElementById('marca-perfil').textContent = perfil ? ' · ' + PERFIS[perfil].rotulo : '';
    document.title = (perfil ? PERFIS[perfil].nome + ' · ' : '') + 'Sistema Acadêmico · SEDUC/SE';
    main.innerHTML = perfil === 'aluno' ? telaAluno() : perfil === 'professor' ? telaProfessor() : perfil === 'secretaria' ? telaSecretaria() : telaPerfis();
    if (focar) { window.scrollTo(0, 0); main.focus(); }
  }
  window.addEventListener('hashchange', function () { desenhar(true); });

  // ---------- Ações ----------
  document.addEventListener('click', function (e) {
    var ir = e.target.closest('[data-ir]');
    if (ir) { e.preventDefault(); if (location.hash) location.hash = ''; else desenhar(true); return; }
    var esc2 = e.target.closest('[data-escala]');
    if (esc2) { escala = Math.min(1.5, Math.max(0.9, Math.round((escala + Number(esc2.dataset.escala)) * 10) / 10)); aplicarEscala(escala); return; }
    var ouvir = e.target.closest('[data-ouvir]');
    if (ouvir) { ler(ouvir.dataset.ouvir); return; }

    var b = e.target.closest('button');
    if (!b || !main.contains(b)) return;

    if (b.id === 'btn-historico') avisar('Pedido enviado. A secretaria vai emitir o histórico escolar.');

    if (b.dataset.presenca) {
      var id = Number(b.dataset.presenca);
      alunosTurma.forEach(function (a) { if (a.id === id) a.presente = b.dataset.valor === '1'; });
      desenhar();
      var alvo = main.querySelector('[data-presenca="' + id + '"][data-valor="' + b.dataset.valor + '"]');
      if (alvo) alvo.focus();
    }
    if (b.id === 'btn-frequencia') avisar('Frequência salva no diário de classe.');
    if (b.id === 'btn-notas') {
      erroNotas = null;
      for (var i = 0; i < alunosTurma.length; i++) {
        var a = alunosTurma[i];
        var v = Number(String(a.nota).replace(',', '.'));
        if (String(a.nota).trim() === '' || isNaN(v) || v < 0 || v > 10) {
          erroNotas = { id: a.id, texto: 'Nota inválida em ' + a.nome + ': use um valor de 0 a 10.' };
          break;
        }
      }
      desenhar();
      if (erroNotas) { main.querySelector('#nota-' + erroNotas.id).focus(); return; }
      avisar('Notas do 2º trimestre salvas.');
    }

    if (b.dataset.filtro) { filtro = b.dataset.filtro; recusando = null; desenhar(); }
    if (b.dataset.confirmar) {
      filaMatricula.forEach(function (p) { if (p.id === Number(b.dataset.confirmar)) p.status = 'Confirmada'; });
      desenhar(); avisar('Matrícula confirmada.');
    }
    if (b.dataset.recusar) {
      recusando = Number(b.dataset.recusar); erroRecusa = ''; desenhar();
      main.querySelector('#motivo').focus();
    }
    if ('cancelarRecusa' in b.dataset) {
      var anterior = recusando; recusando = null; desenhar();
      var volta = main.querySelector('[data-recusar="' + anterior + '"]');
      if (volta) volta.focus();
    }
    if (b.dataset.confirmarRecusa) {
      var motivo = main.querySelector('#motivo').value.trim();
      if (motivo.length < 5) {
        erroRecusa = 'Escreva o motivo com pelo menos 5 caracteres. A família verá este texto.';
        desenhar(); main.querySelector('#motivo').focus(); return;
      }
      filaMatricula.forEach(function (p) { if (p.id === Number(b.dataset.confirmarRecusa)) { p.status = 'Recusada'; p.motivo = motivo; } });
      recusando = null; erroRecusa = '';
      desenhar(); avisar('Matrícula recusada. A família será avisada.');
    }
    if (b.dataset.relatorio) avisar('Gerando “' + b.dataset.relatorio + '”…');
  });

  // Guarda o que o professor digita sem redesenhar a cada tecla.
  main.addEventListener('input', function (e) {
    var id = e.target.dataset && e.target.dataset.nota;
    if (!id) return;
    alunosTurma.forEach(function (a) { if (a.id === Number(id)) a.nota = e.target.value; });
    if (erroNotas && erroNotas.id === Number(id)) { e.target.removeAttribute('aria-invalid'); }
  });

  desenhar(false);
})();
</script>
</body>
</html>
