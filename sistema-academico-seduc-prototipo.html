<script>
// Domínio: notas, frequência e situação do estudante. Todas as regras de aprovação ficam aqui.
//
// Regras (Lei de Diretrizes e Bases: frequência mínima de 75% das aulas dadas):
//  - Média do estudante na matéria = média das notas dos bimestres já lançados, com 1 casa decimal.
//  - Frequência (%) = 100 − faltas ÷ aulas dadas × 100.
//  - Frequência abaixo de 75%          → Reprovado por frequência.
//  - Média de 6,0 ou mais              → Aprovado.
//  - Média de 4,0 a 5,9                → Em recuperação.
//  - Média abaixo de 4,0               → Reprovado.
//  - Sem nenhuma nota lançada          → Sem notas (situação ainda não definida).

const MEDIA_APROVACAO = 6;
const MEDIA_RECUPERACAO = 4;
const PRESENCA_MINIMA = 75;

const lancada = (n) => n !== null && n !== undefined && n !== '' && !Number.isNaN(Number(n));

/**
 * Média das notas dos bimestres já lançados, com 1 casa decimal.
 * @param {...(number|null)} notas Notas dos bimestres; vazias (null) são ignoradas.
 * @returns {number|null} Null quando nenhuma nota foi lançada.
 */
function media(...notas) {
  const valores = notas.filter(lancada).map(Number);
  if (!valores.length) return null;
  return Math.round((valores.reduce((s, n) => s + n, 0) / valores.length) * 10) / 10;
}

/**
 * Frequência em porcentagem.
 * @param {number} faltas
 * @param {number} aulasDadas Aulas dadas até hoje no ano letivo.
 * @returns {number} De 0 a 100.
 */
const presenca = (faltas, aulasDadas) => (aulasDadas > 0 ? Math.min(100, Math.max(0, 100 - (faltas / aulasDadas) * 100)) : 100);

/**
 * Situação do estudante numa matéria, aplicando as regras do topo deste arquivo.
 * @param {number|null} mediaMateria
 * @param {number} [frequencia] Frequência geral em %.
 * @returns {{chave: 'aprovado'|'recuperacao'|'reprovado'|'sem-notas', texto: string, tipo: 'ok'|'atencao'|'erro'|'neutra', motivo: string}}
 */
function situacao(mediaMateria, frequencia = 100) {
  if (frequencia < PRESENCA_MINIMA) return { chave: 'reprovado', texto: 'Reprovado por frequência', tipo: 'erro', motivo: `Frequência abaixo de ${PRESENCA_MINIMA}%` };
  if (mediaMateria === null) return { chave: 'sem-notas', texto: 'Sem notas', tipo: 'neutra', motivo: 'Nenhuma nota lançada' };
  if (mediaMateria >= MEDIA_APROVACAO) return { chave: 'aprovado', texto: 'Aprovado', tipo: 'ok', motivo: `Média ${MEDIA_APROVACAO} ou mais` };
  if (mediaMateria >= MEDIA_RECUPERACAO) return { chave: 'recuperacao', texto: 'Em recuperação', tipo: 'atencao', motivo: `Média entre ${MEDIA_RECUPERACAO} e ${MEDIA_APROVACAO}` };
  return { chave: 'reprovado', texto: 'Reprovado', tipo: 'erro', motivo: `Média abaixo de ${MEDIA_RECUPERACAO}` };
}

/**
 * Notas, faltas e situação de um estudante. Se a turma tem diário do professor, Matemática e faltas vêm dele.
 * @param {object} est Estudante de estudantes.json.
 * @param {object} diario Diário por turma: { [turmaId]: [{id, n1, n2, faltas}] }.
 * @param {number} aulasDadas Aulas dadas no ano (data/letivo.json).
 * @returns {{linhas: Array, faltas: number, presenca: number, matematicaDoDiario: boolean}}
 */
function desempenho(est, diario, aulasDadas) {
  const doDiario = est.turmaId && diario?.[est.turmaId]?.find((a) => a.id === est.id);
  const notas = { ...est.notas };
  if (doDiario) notas['Matemática'] = [doDiario.n1, doDiario.n2];
  const faltas = doDiario ? doDiario.faltas : (est.faltas ?? 0);
  const freq = presenca(faltas, aulasDadas);
  const linhas = Object.entries(notas).map(([materia, [n1, n2]]) => {
    const m = media(n1, n2);
    return { materia, n1, n2, media: m, situacao: situacao(m, freq) };
  });
  linhas.sort((a, b) => (a.materia === 'Matemática' ? -1 : b.materia === 'Matemática' ? 1 : 0));
  return { linhas, faltas, presenca: freq, matematicaDoDiario: Boolean(doDiario) };
}
</script>
<!-- END:regras -->

    return copia(BASE);

  // Preferência de tamanho de letra (só conveniência; funciona sem armazenamento).
  function lerEscala() { try { return Number(localStorage.getItem('prototipo-escala')) || 1; } catch (e) { return 1; } }
  function aplicarEscala(v) {
    document.documentElement.style.setProperty('--escala', v);
    try { localStorage.setItem('prototipo-escala', v); } catch (e) { /* segue sem guardar */ }
  }
  var escala = lerEscala();
  aplicarEscala(escala);

  // Leitura em voz alta (botão Ouvir dos wireframes).
  var podeLer = 'speechSynthesis' in window;
  function botaoOuvir(texto, rotulo) {
    if (!podeLer) return '';
    var so = !rotulo;
    return '<button type="button" class="botao-ouvir' + (so ? ' so-icone' : '') + '" data-ouvir="' + esc(texto) + '" aria-label="Ouvir em voz alta">' + icone('alto', 20) + (so ? '' : '<span>' + esc(rotulo) + '</span>') + '</button>';
  }

    speechSynthesis.cancel();
    var fala = new SpeechSynthesisUtterance(texto);
    fala.lang = 'pt-BR';
    fala.rate = 0.95;
    speechSynthesis.speak(fala);
  }

  // Aviso rápido: a região "status" existe desde o carregamento, para o leitor de tela anunciar.
  var timerAviso;
  function avisar(texto) {
    var el = document.getElementById('aviso-rapido');
    el.textContent = texto;
    el.classList.add('visivel');
    clearTimeout(timerAviso);
    timerAviso = setTimeout(function () { el.classList.remove('visivel'); el.textContent = ''; }, 5000);
  }

  // Confirmação antes de ações que não dá para desfazer. <dialog> nativo: prende o foco e fecha com Esc.
  var dialogo = document.getElementById('dialogo');
  var resolverDialogo = null;
  function confirmar(titulo, texto, botao, perigo) {
    return new Promise(function (resolve) {
      document.getElementById('dialogo-titulo').textContent = titulo;
      document.getElementById('dialogo-texto').textContent = texto;
      var sim = document.getElementById('dialogo-sim');
      sim.textContent = botao || 'Confirmar';
      sim.className = 'botao' + (perigo ? ' botao-perigo' : '');
      resolverDialogo = resolve;
      dialogo.showModal();
      dialogo.querySelector('[data-dialogo="nao"]').focus();
    });

    var b = e.target.closest('[data-dialogo]');
    if (b) dialogo.close(b.dataset.dialogo);
  });
  dialogo.addEventListener('close', function () {
    if (resolverDialogo) { resolverDialogo(dialogo.returnValue === 'sim'); resolverDialogo = null; }

  var main = document.getElementById('conteudo');
  var PERFIS = {

  var recusando = null;
  var erroRecusa = '';
  var erroNotas = null; // { id, texto }
  var ausentes = {};    // chamada em andamento: { idDoEstudante: true }

  // ---------- W1 · Seleção de perfil ----------
  function telaPerfis() {
    return '<h1 class="titulo-inicial">Quem está usando o portal?</h1>' +
      '<p class="texto-suave lead">Escolha seu perfil. No protótipo, o acesso é simulado.</p>' +
      Object.keys(PERFIS).map(function (k) {
        var p = PERFIS[k];
        return '<div class="bloco"><a href="#' + k + '"><span class="icone">' + icone(p.icone, 30) + '</span><span><strong>' + p.nome + '</strong><small>' + p.desc + '</small></span></a>' + botaoOuvir(p.nome + '. ' + p.desc + '.') + '</div>';
      }).join('') +
      '<p class="rodape-prototipo">Protótipo de demonstração · SEDUC/SE · dados fictícios · ' +
      '<button type="button" class="botao botao-secundario botao-mini" data-reiniciar>Reiniciar demonstração</button></p>';
  }

  // ---------- W2 + W5 · Família: notas e faltas (mesmas regras do portal) ----------
  function telaAluno() {
    var est = dados.estudante;
    var d = desempenho(est, dados.diario, dados.letivo.aulasDadas);
    var freq = Math.round(d.presenca);
    var atencao = d.linhas.filter(function (l) { return l.situacao.chave === 'recuperacao' || l.situacao.chave === 'reprovado'; }).map(function (l) { return l.materia; });
    var nome = est.nome.split(' ')[0];
    var resumo = 'A presença de ' + nome + ' está em ' + freq + ' por cento. O mínimo é ' + PRESENCA_MINIMA + ' por cento. ' +
      (atencao.length ? 'Precisa de atenção em: ' + atencao.join(', ') + '.' : 'A média está boa em todas as matérias.');
    return '<h1 class="titulo-tela">Olá! Veja como ' + esc(nome) + ' está indo</h1>' +
      '<div class="estudante"><span class="avatar" aria-hidden="true">' + esc(est.nome[0]) + '</span><div><strong class="titulo-cartao">' + esc(est.nome) + '</strong><br><span class="texto-suave">' + esc(est.turma) + ' · ' + esc(nomeCurto(dados.escola.nome)) + '</span></div></div>' +
      '<div class="cartao cartao-destaque">' +
        '<div class="linha-entre"><strong class="titulo-cartao">Presença nas aulas</strong>' + botaoOuvir(resumo, 'Resumo') + '</div>' +
        '<p class="numero-grande">' + freq + '%</p>' +
        '<p class="texto-suave sem-margem-topo">Mínimo para passar de ano: ' + PRESENCA_MINIMA + '%</p>' +
        '<div class="barra" role="img" aria-label="Presença de ' + freq + ' por cento; mínimo de ' + PRESENCA_MINIMA + '"><span style="width:' + freq + '%"></span><i class="marca-minimo" style="left:' + PRESENCA_MINIMA + '%"></i></div>' +
      '</div>' +
      '<h2>Boletim · ' + dados.letivo.bimestresLancados + 'º bimestre</h2>' +
      '<div class="materias-cabecalho" aria-hidden="true"><span>Matéria</span><span class="direita">Média</span><span>Situação</span></div>' +
      '<ul class="materias lista-limpa" aria-label="Notas por matéria">' +
        d.linhas.map(function (l) {
          return '<li><details class="materia"><summary><span>' + esc(l.materia) + '</span><strong><span class="sr-only">média </span>' + num(l.media) + '</strong>' +
            etiqueta(l.situacao.texto, l.situacao.tipo) + '</summary>' +
            '<div class="unidades"><span>1º bimestre: <strong>' + (l.n1 === null ? 'ainda não lançada' : num(l.n1)) + '</strong></span><span>2º bimestre: <strong>' + (l.n2 === null ? 'ainda não lançada' : num(l.n2)) + '</strong></span></div></details></li>';
        }).join('') +
      '</ul>' +
      '<p class="texto-suave nota">Toque em uma matéria para ver as notas de cada bimestre. A situação é parcial, pois o ano letivo ainda não terminou.' + (d.matematicaDoDiario ? ' A nota de Matemática vem do diário do professor.' : '') + '</p>' +
      '<h2>Próximas datas</h2>' +
      dados.calendario.map(function (a) {
        return '<div class="cartao linha-entre sem-quebra"><span class="icone-atividade">' + icone('calendario', 24) + '</span><div class="preenche"><strong>' + esc(a.titulo) + '</strong><br><span class="texto-suave">' + esc(a.data) + '</span></div></div>';
      }).join('') +
      '<h2>Documentos</h2>' +
      '<div class="cartao"><p class="sem-margem-topo">Peça documentos escolares diretamente à secretaria.</p>' +
        '<button type="button" class="botao botao-grande botao-largo" id="btn-historico">' + icone('documento', 22) + 'Solicitar histórico escolar</button></div>';
  }

  // ---------- W13 · Professor: diário de classe ----------
  function mediaTurma() {
    var medias = alunosTurma().map(function (a) { return media(a.n1, a.n2); }).filter(function (m) { return m !== null; });
    return medias.length ? num(medias.reduce(function (s, n) { return s + n; }, 0) / medias.length) : '—';
  }
  function telaProfessor() {
    var t = turma();
    var alunos = alunosTurma();
    var feita = dados.chamadaFeita && dados.chamadaFeita.data === hojeISO() ? dados.chamadaFeita : null;
    var nAusentes = feita ? feita.ausentes.length : alunos.filter(function (a) { return ausentes[a.id]; }).length;
    var presentes = alunos.length - nAusentes;
    var hoje = new Date().toLocaleDateString('pt-BR');
    return '<h1 class="titulo-tela sem-margem-base">Diário de classe</h1>' +
      '<p class="texto-suave sem-margem-topo">' + esc(nomeCurto(dados.escola.nome)) + ' · Matemática · ' + esc(t.nome) + ' · ' + dados.letivo.aulasDadas + ' aulas dadas no ano</p>' +
      '<div class="numeros">' +
        '<div class="numero"><strong>' + alunos.length + '</strong><span>estudantes na turma</span></div>' +
        '<div class="numero"><strong>' + presentes + '</strong><span>presentes hoje</span></div>' +
        '<div class="numero' + (nAusentes ? ' alerta' : '') + '"><strong>' + nAusentes + '</strong><span>ausentes hoje</span></div>' +
        '<div class="numero"><strong>' + mediaTurma() + '</strong><span>média da turma</span></div>' +
      '</div>' +
      '<h2>Chamada de hoje · ' + hoje + '</h2>' +
      (feita ? '<div class="cartao"><strong>Chamada registrada</strong><p class="sem-margem-base">' + (feita.ausentes.length ? feita.ausentes.length + ' falta(s) lançada(s) no diário.' : 'Todos presentes.') + '</p></div>' :
      '<div class="cartao"><ul class="lista-cartao chamada">' +
        alunos.map(function (a) {
          var falta = !!ausentes[a.id];
          return '<li><span class="nome">' + esc(a.nome) + '</span><span class="chamada-botoes" role="group" aria-label="Frequência de ' + esc(a.nome) + '">' +
            '<button type="button" class="botao ' + (falta ? 'botao-secundario' : '') + '" data-presenca="' + a.id + '" data-valor="1" aria-pressed="' + !falta + '">Presente</button>' +
            '<button type="button" class="botao ' + (falta ? 'botao-perigo' : 'botao-secundario') + '" data-presenca="' + a.id + '" data-valor="0" aria-pressed="' + falta + '">Ausente</button></span></li>';
        }).join('') +
      '</ul></div>' +
      '<button type="button" class="botao botao-largo" id="btn-frequencia">' + icone('ok', 20) + 'Registrar chamada</button>') +
      '<h2>Lançar notas · ' + dados.letivo.bimestresLancados + 'º bimestre</h2>' +
      '<div class="cartao"><ul class="lista-cartao">' +
        alunos.map(function (a) {
          var invalido = erroNotas && erroNotas.id === a.id;
          var valor = a.n2 === null ? '' : String(a.n2).replace('.', ',');
          return '<li><label class="nome" for="nota-' + a.id + '">' + esc(a.nome) + '</label><input id="nota-' + a.id + '" class="entrada nota-entrada" inputmode="decimal" placeholder="0,0" data-nota="' + a.id + '" data-vazio="' + (a.n2 === null) + '" value="' + esc(valor) + '"' + (invalido ? ' aria-invalid="true" aria-describedby="erro-notas"' : '') + '></li>';
        }).join('') +
      '</ul></div>' +
      '<div id="erro-notas" role="alert">' + (erroNotas ? '<p class="alerta-erro">' + icone('alerta', 20) + '<span>' + esc(erroNotas.texto) + '</span></p>' : '') + '</div>' +
      '<div class="linha-botoes"><button type="button" class="botao" id="btn-notas">' + icone('ok', 20) + 'Salvar notas</button><span class="texto-suave">As notas salvas aparecem para a família.</span></div>';
  }

  // ---------- W14 · Escola: pedidos de matrícula ----------
  function painelRecusa(p) {
    return '<div class="painel-inline" role="group" aria-labelledby="recusa-titulo">' +
      '<h2 id="recusa-titulo">Recusar matrícula de ' + esc(p.estudante) + '</h2>' +
      '<div class="campo sem-margem"><label for="motivo">Motivo <span class="dica">(obrigatório; a família verá este texto)</span></label>' +
      '<textarea id="motivo" class="entrada" aria-describedby="motivo-erro"' + (erroRecusa ? ' aria-invalid="true"' : '') + '></textarea>' +
      '<p id="motivo-erro" class="erro">' + esc(erroRecusa) + '</p></div>' +
      '<div class="linha-botoes fim"><button type="button" class="botao botao-secundario" data-cancelar-recusa>Cancelar</button><button type="button" class="botao" data-confirmar-recusa="' + esc(p.protocolo) + '">Confirmar recusa</button></div></div>';
  }
  function telaSecretaria() {
    var abas = ['Aguardando confirmação', 'Confirmada', 'Recusada'];
    var nomes = { 'Aguardando confirmação': 'Aguardando', Confirmada: 'Confirmadas', Recusada: 'Recusadas' };
    var vazios = { 'Aguardando confirmação': 'Nenhum pedido aguardando.', Confirmada: 'Nenhuma matrícula confirmada ainda.', Recusada: 'Nenhum pedido recusado.' };
    var lista = dados.pedidos.filter(function (p) { return p.situacao === filtro; });
    var aprovadas = dados.turmas.filter(function (t) { return t.situacao === 'Aprovada'; });
    var estudantes = aprovadas.reduce(function (s, t) { return s + t.matriculados; }, 0);
    var aguardando = dados.pedidos.filter(function (p) { return p.situacao === 'Aguardando confirmação'; }).length;
    return '<h1>Pedidos de matrícula</h1>' +
      '<div class="filtros" role="group" aria-label="Filtrar por situação">' +
        abas.map(function (a) { var n = dados.pedidos.filter(function (p) { return p.situacao === a; }).length; return '<button type="button" data-filtro="' + a + '" aria-pressed="' + (a === filtro) + '">' + nomes[a] + (n ? ' (' + n + ')' : '') + '</button>'; }).join('') +
      '</div>' +
      (lista.length ? lista.map(function (p) {
        var tipo = p.situacao === 'Confirmada' ? 'ok' : p.situacao === 'Recusada' ? 'erro' : 'atencao';
        return '<div class="cartao"><strong class="titulo-cartao">' + esc(p.estudante) + '</strong><br>' +
          '<span class="texto-suave nota">' + esc(p.tipo) + ' · ' + esc(p.serie) + ' · Responsável: ' + esc(p.responsavel) + ' · ' + esc(p.protocolo) + '</span>' +
          (p.motivo ? '<p class="sem-margem-base">Motivo: ' + esc(p.motivo) + '</p>' : '') +
          '<div class="espaco-topo">' + etiqueta(p.situacao, tipo) + '</div>' +
          (p.situacao === 'Aguardando confirmação' ? '<div class="chamada-botoes espaco-topo"><button type="button" class="botao" data-confirmar="' + esc(p.protocolo) + '">Confirmar</button><button type="button" class="botao botao-secundario" data-recusar="' + esc(p.protocolo) + '" aria-expanded="' + (recusando === p.protocolo) + '">Recusar</button></div>' : '') +
          '</div>' + (recusando === p.protocolo ? painelRecusa(p) : '');
      }).join('') : '<div class="estado-vazio"><strong>' + vazios[filtro] + '</strong></div>') +
      '<h2>Painel da escola</h2>' +
      '<div class="numeros">' +
        '<div class="numero"><strong>' + estudantes + '</strong><span>estudantes enturmados</span></div>' +
        '<div class="numero"><strong>' + dados.professoresDaEscola + '</strong><span>professores na rede simulada</span></div>' +
        '<div class="numero"><strong>' + aprovadas.length + '</strong><span>turmas aprovadas</span></div>' +
        '<div class="numero' + (aguardando ? ' alerta' : '') + '"><strong>' + aguardando + '</strong><span>' + (aguardando === 1 ? 'pedido aguardando' : 'pedidos aguardando') + '</span></div>' +
      '</div>' +
      '<h2>Relatórios</h2>' +
      '<div class="opcoes">' +
        [['Boletim consolidado', 'documento'], ['Histórico escolar', 'livro'], ['Censo Escolar (Educacenso)', 'grade']].map(function (r) {
          return '<button type="button" class="opcao relatorio" data-relatorio="' + esc(r[0]) + '">' + icone(r[1], 26) + '<span>' + esc(r[0]) + '<small>Disponível na versão completa</small></span></button>';
        }).join('') +
      '</div>';
  }

  // ---------- Roteamento por endereço (#aluno, #professor, #secretaria) ----------
  var perfilAtual = '';
  function desenhar(focar) {
    var perfil = location.hash.slice(1);
    if (!PERFIS[perfil]) perfil = '';
    if (perfil !== perfilAtual) { filtro = 'Aguardando confirmação'; recusando = null; erroRecusa = ''; erroNotas = null; ausentes = {}; }
    perfilAtual = perfil;
    document.getElementById('btn-sair').hidden = !perfil;
    document.getElementById('btn-menos').hidden = !!perfil; // W2: no perfil, só A+ e Sair
    document.getElementById('marca-perfil').textContent = perfil ? ' · ' + PERFIS[perfil].rotulo : '';
    document.title = (perfil ? PERFIS[perfil].nome + ' · ' : '') + 'Sistema Acadêmico · SEDUC/SE';
    main.innerHTML = perfil === 'aluno' ? telaAluno() : perfil === 'professor' ? telaProfessor() : perfil === 'secretaria' ? telaSecretaria() : telaPerfis();
    if (focar) { window.scrollTo(0, 0); main.focus(); }
  }
  window.addEventListener('hashchange', function () { desenhar(true); });

  // Valida as notas digitadas. Devolve o primeiro erro ou null. Campo vazio só vale se a nota ainda não foi lançada.
  function validarNotas() {
    var campos = main.querySelectorAll('[data-nota]');
    for (var i = 0; i < campos.length; i++) {
      var c = campos[i];
      var texto = c.value.trim();
      if (texto === '' && c.dataset.vazio === 'true') continue;
      var v = Number(texto.replace(',', '.'));
      if (texto === '' || isNaN(v) || v < 0 || v > 10) {
        var aluno = alunosTurma().filter(function (a) { return a.id === c.dataset.nota; })[0];
        return { id: c.dataset.nota, texto: 'Nota inválida em ' + aluno.nome + ': use um valor de 0 a 10.' };
      }
    }
    return null;
  }

  // ---------- Ações ----------
  document.addEventListener('click', function (e) {
    var ir = e.target.closest('[data-ir]');
    if (ir) { e.preventDefault(); if (location.hash) location.hash = ''; else desenhar(true); return; }
    var esc2 = e.target.closest('[data-escala]');
    if (esc2) { escala = Math.min(1.5, Math.max(0.9, Math.round((escala + Number(esc2.dataset.escala)) * 10) / 10)); aplicarEscala(escala); return; }
    var ouvir = e.target.closest('[data-ouvir]');
    if (ouvir) { ler(ouvir.dataset.ouvir); return; }

    var b = e.target.closest('button');
    if (!b || !main.contains(b)) return;

    if (b.dataset.reiniciar !== undefined) {
      confirmar('Reiniciar a demonstração?', 'Apaga as notas, a chamada e as confirmações feitas neste protótipo. Os dados voltam ao início.', 'Reiniciar', true).then(function (sim) {
        if (!sim) return;
        dados = copia(BASE); dados.chamadaFeita = null; guardar(); desenhar(); avisar('Demonstração reiniciada.');
      });
      return;
    }
    if (b.id === 'btn-historico') avisar('Pedido enviado. A secretaria vai emitir o histórico escolar.');

    if (b.dataset.presenca) {
      var id = b.dataset.presenca;
      if (b.dataset.valor === '1') delete ausentes[id]; else ausentes[id] = true;
      desenhar();
      var alvo = main.querySelector('[data-presenca="' + id + '"][data-valor="' + b.dataset.valor + '"]');
      if (alvo) alvo.focus();
    }
    if (b.id === 'btn-frequencia') {
      var faltosos = alunosTurma().filter(function (a) { return ausentes[a.id]; });
      var texto = faltosos.length ? 'Vai somar 1 falta para: ' + faltosos.map(function (a) { return a.nome; }).join(', ') + '. Depois de registrada, a chamada de hoje não pode ser refeita.' : 'Todos presentes. Depois de registrada, a chamada de hoje não pode ser refeita.';
      confirmar('Registrar a chamada de hoje?', texto, 'Registrar chamada').then(function (sim) {
        if (!sim) return;
        faltosos.forEach(function (a) { a.faltas += 1; });
        dados.chamadaFeita = { data: hojeISO(), ausentes: faltosos.map(function (a) { return a.id; }) };
        ausentes = {};
        guardar(); desenhar(); avisar('Chamada registrada.');
      });
    }
    if (b.id === 'btn-notas') {
      erroNotas = validarNotas();
      if (erroNotas) {
        desenhar();
        main.querySelector('#nota-' + erroNotas.id).focus();
        return;
      }
      main.querySelectorAll('[data-nota]').forEach(function (c) {
        if (c.value.trim() === '') return;
        alunosTurma().forEach(function (a) { if (a.id === c.dataset.nota) a.n2 = Math.round(Number(c.value.replace(',', '.')) * 10) / 10; });
      });
      guardar(); desenhar();
      avisar('Notas do ' + dados.letivo.bimestresLancados + 'º bimestre salvas. Já aparecem para a família.');
    }

    if (b.dataset.filtro) { filtro = b.dataset.filtro; recusando = null; desenhar(); }
    if (b.dataset.confirmar) {
      var alvoPedido = dados.pedidos.filter(function (p) { return p.protocolo === b.dataset.confirmar; })[0];
      confirmar('Confirmar a matrícula?', alvoPedido.estudante + ' passa a ser aluno(a) da escola na ' + alvoPedido.serie + ', e a família é avisada. A confirmação não pode ser desfeita por aqui.', 'Confirmar matrícula').then(function (sim) {
        if (!sim) return;
        alvoPedido.situacao = 'Confirmada'; guardar(); desenhar(); avisar('Matrícula confirmada.');
      });
    }
    if (b.dataset.recusar) {
      recusando = b.dataset.recusar; erroRecusa = ''; desenhar();
      main.querySelector('#motivo').focus();
    }
    if ('cancelarRecusa' in b.dataset) {
      var anterior = recusando; recusando = null; desenhar();
      var volta = main.querySelector('[data-recusar="' + anterior + '"]');
      if (volta) volta.focus();
    }
    if (b.dataset.confirmarRecusa) {
      var motivo = main.querySelector('#motivo').value.trim();
      if (motivo.length < 5) {
        erroRecusa = 'Escreva o motivo com pelo menos 5 caracteres. A família verá este texto.';
        desenhar(); main.querySelector('#motivo').focus(); return;
      }
      dados.pedidos.forEach(function (p) { if (p.protocolo === b.dataset.confirmarRecusa) { p.situacao = 'Recusada'; p.motivo = motivo; } });
      recusando = null; erroRecusa = '';
      guardar(); desenhar(); avisar('Matrícula recusada. A família será avisada.');
    }
    if (b.dataset.relatorio) avisar('“' + b.dataset.relatorio + '” estará disponível na versão completa do sistema.');
  });

  // Limpa o aviso de erro assim que a pessoa corrige o campo.
  main.addEventListener('input', function (e) {
    if (!e.target.dataset || !e.target.dataset.nota) return;
    if (erroNotas && erroNotas.id === e.target.dataset.nota) { e.target.removeAttribute('aria-invalid'); }
  });

  desenhar(false);
})();
</script>
</body>
</html>
