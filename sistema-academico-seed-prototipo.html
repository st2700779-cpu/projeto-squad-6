<script>
// Domínio: notas, frequência e situação do estudante. Todas as regras de aprovação ficam aqui.
//
// Regras (Lei de Diretrizes e Bases: frequência mínima de 75% das aulas dadas):
//  - Média do estudante na matéria = média das notas dos bimestres já lançados, com 1 casa decimal.
//  - Frequência (%) = 100 − faltas ÷ aulas dadas × 100.
//  - Frequência abaixo de 75%          → Reprovado por frequência.
//  - Média de 6,0 ou mais              → Aprovado.
//  - Média de 4,0 a 5,9                → Em recuperação.
//  - Média abaixo de 4,0               → Reprovado.
//  - Sem nenhuma nota lançada          → Sem notas (situação ainda não definida).

const MEDIA_APROVACAO = 6;
const MEDIA_RECUPERACAO = 4;
const PRESENCA_MINIMA = 75;

const lancada = (n) => n !== null && n !== undefined && n !== '' && !Number.isNaN(Number(n));

/**
 * Média das notas dos bimestres já lançados, com 1 casa decimal.
 * @param {...(number|null)} notas Notas dos bimestres; vazias (null) são ignoradas.
 * @returns {number|null} Null quando nenhuma nota foi lançada.
 */
function media(...notas) {
  const valores = notas.filter(lancada).map(Number);
  if (!valores.length) return null;
  return Math.round((valores.reduce((s, n) => s + n, 0) / valores.length) * 10) / 10;
}

/**
 * Frequência em porcentagem.
 * @param {number} faltas
 * @param {number} aulasDadas Aulas dadas até hoje no ano letivo.
 * @returns {number} De 0 a 100.
 */
const presenca = (faltas, aulasDadas) => (aulasDadas > 0 ? Math.min(100, Math.max(0, 100 - (faltas / aulasDadas) * 100)) : 100);

/**
 * Situação do estudante numa matéria, aplicando as regras do topo deste arquivo.
 * @param {number|null} mediaMateria
 * @param {number} [frequencia] Frequência geral em %.
 * @returns {{chave: 'aprovado'|'recuperacao'|'reprovado'|'sem-notas', texto: string, tipo: 'ok'|'atencao'|'erro'|'neutra', motivo: string}}
 */
function situacao(mediaMateria, frequencia = 100) {
  if (frequencia < PRESENCA_MINIMA) return { chave: 'reprovado', texto: 'Reprovado por frequência', tipo: 'erro', motivo: `Frequência abaixo de ${PRESENCA_MINIMA}%` };
  if (mediaMateria === null) return { chave: 'sem-notas', texto: 'Sem notas', tipo: 'neutra', motivo: 'Nenhuma nota lançada' };
  if (mediaMateria >= MEDIA_APROVACAO) return { chave: 'aprovado', texto: 'Aprovado', tipo: 'ok', motivo: `Média ${MEDIA_APROVACAO} ou mais` };
  if (mediaMateria >= MEDIA_RECUPERACAO) return { chave: 'recuperacao', texto: 'Em recuperação', tipo: 'atencao', motivo: `Média entre ${MEDIA_RECUPERACAO} e ${MEDIA_APROVACAO}` };
  return { chave: 'reprovado', texto: 'Reprovado', tipo: 'erro', motivo: `Média abaixo de ${MEDIA_RECUPERACAO}` };
}

/**
 * Notas, faltas e situação de um estudante. Se a turma tem diário do professor, Matemática e faltas vêm dele.
 * @param {object} est Estudante de estudantes.json.
 * @param {object} diario Diário por turma: { [turmaId]: [{id, n1, n2, faltas}] }.
 * @param {number} aulasDadas Aulas dadas no ano (data/letivo.json).
 * @returns {{linhas: Array, faltas: number, abonadas: number, presenca: number, matematicaDoDiario: boolean}} faltas já sem as abonadas (quando o diário vem de diarioParaLeitura)
 */
function desempenho(est, diario, aulasDadas) {
  const doDiario = est.turmaId && diario?.[est.turmaId]?.find((a) => a.id === est.id);
  const notas = { ...est.notas };
  if (doDiario) notas['Matemática'] = [doDiario.n1, doDiario.n2];
  const faltas = doDiario ? doDiario.faltas : (est.faltas ?? 0);
  const freq = presenca(faltas, aulasDadas);
  const linhas = Object.entries(notas).map(([materia, [n1, n2]]) => {
    const m = media(n1, n2);
    return { materia, n1, n2, media: m, situacao: situacao(m, freq) };
  });
  linhas.sort((a, b) => (a.materia === 'Matemática' ? -1 : b.materia === 'Matemática' ? 1 : 0));
  return { linhas, faltas, abonadas: doDiario?.abonadas ?? 0, presenca: freq, matematicaDoDiario: Boolean(doDiario) };
}
</script>

            ? '<div class="linha-botoes coluna-botoes"><button type="button" class="botao botao-mini" data-confirmar="' + esc(p.protocolo) + '" aria-label="Confirmar matrícula de ' + esc(p.estudante) + '">Confirmar matrícula</button><button type="button" class="botao botao-secundario botao-mini" data-recusar="' + esc(p.protocolo) + '" aria-expanded="' + (recusando === p.protocolo) + '" aria-label="Recusar matrícula de ' + esc(p.estudante) + '">Recusar matrícula</button></div>' : '';
          return '<tr><td class="titulo-linha"><strong>' + esc(p.estudante) + '</strong><small>' + esc(p.protocolo) + ' · resp. ' + esc(p.responsavel) + '</small></td><td data-rotulo="Tipo">' + esc(p.tipo) + '</td><td class="sem-quebra-texto" data-rotulo="Série">' + esc(p.serie) + '</td><td class="num" data-rotulo="Pedido em">' + esc(p.data) + '</td>' +
            '<td data-rotulo="Situação">' + etiqueta(p.situacao, tipo) + (p.motivo ? '<small>Motivo: ' + esc(p.motivo) + '</small>' : '') + '</td><td class="acoes">' + acoes + '</td></tr>';
        }).join('') +
        '</tbody></table></div><p class="contagem">' + lista.length + (lista.length === 1 ? ' pedido' : ' pedidos') + ' · ' + nomes[filtro].toLowerCase() + '</p>'
        : '<div class="estado-vazio"><strong>' + vazios[filtro] + '</strong></div>') +
      '<h2>Relatórios</h2>' +
      '<ul class="lista-texto">' +
        ['Boletim consolidado', 'Histórico escolar', 'Censo Escolar (Educacenso)'].map(function (r) {
          return '<li><button type="button" class="botao botao-texto botao-mini" data-relatorio="' + esc(r) + '">' + esc(r) + '</button> <span class="texto-suave">ainda não disponível no protótipo</span></li>';
        }).join('') +
      '</ul>' +
      '<p class="texto-suave nota">Pendências: ' + aguardando + (aguardando === 1 ? ' pedido aguardando confirmação' : ' pedidos aguardando confirmação') + ' · ' + dados.professoresDaEscola + ' professores cadastrados na rede simulada.</p>';
  }

  // ---------- Roteamento por endereço (#aluno, #professor, #secretaria) ----------
  var perfilAtual = '';
  function desenhar(focar) {
    var perfil = location.hash.slice(1);
    if (!PERFIS[perfil]) perfil = '';
    if (perfil !== perfilAtual) { filtro = 'Aguardando confirmação'; recusando = null; erroRecusa = ''; erroNotas = null; ausentes = {}; }
    perfilAtual = perfil;
    document.getElementById('btn-sair').hidden = !perfil;
    document.title = (perfil ? PERFIS[perfil].nome + ' · ' : '') + 'Sistema Acadêmico · SEED/SE';
    var u = perfil && USUARIOS[perfil];
    document.body.dataset.visao = u ? u.visao : 'geral';
    document.getElementById('usuario').hidden = !u;
    if (u) {
      document.getElementById('usuario-avatar').textContent = u.nome.replace(/^Profa?\.\s+/, '').split(' ').slice(0, 2).map(function (p) { return p[0]; }).join('');
      document.getElementById('usuario-nome').textContent = u.nome;
      document.getElementById('usuario-papel').textContent = u.papel;
    }
    var trilha = perfil ? '<nav class="breadcrumb esp-b-4" aria-label="Você está em"><ol><li><a href="#" data-ir="">Início</a></li><li><span aria-current="page">' + PERFIS[perfil].nome + '</span></li></ol></nav>' : '';
    main.innerHTML = trilha + (perfil === 'aluno' ? telaAluno() : perfil === 'professor' ? telaProfessor() : perfil === 'secretaria' ? telaSecretaria() : telaPerfis());
    if (focar) { window.scrollTo(0, 0); main.focus(); }
  }
  window.addEventListener('hashchange', function () { desenhar(true); });

  // Valida as notas digitadas. Devolve o primeiro erro ou null. Campo vazio só vale se a nota ainda não foi lançada.
  function validarNotas() {
    var campos = main.querySelectorAll('[data-nota]');
    for (var i = 0; i < campos.length; i++) {
      var c = campos[i];
      var texto = c.value.trim();
      if (texto === '' && c.dataset.vazio === 'true') continue;
      var v = Number(texto.replace(',', '.'));
      if (texto === '' || isNaN(v) || v < 0 || v > 10) {
        var aluno = alunosTurma().filter(function (a) { return a.id === c.dataset.nota; })[0];
        return { id: c.dataset.nota, texto: 'Nota inválida em ' + aluno.nome + ': use um valor de 0 a 10.' };
      }
    }
    return null;
  }

  // ---------- Ações ----------
  document.addEventListener('click', function (e) {
    var ir = e.target.closest('[data-ir]');
    if (ir) { e.preventDefault(); if (location.hash) location.hash = ''; else desenhar(true); return; }
    var esc2 = e.target.closest('[data-escala]');
    if (esc2) { escala = Math.min(1.5, Math.max(0.9, Math.round((escala + Number(esc2.dataset.escala)) * 10) / 10)); aplicarEscala(escala); return; }
    var ouvir = e.target.closest('[data-ouvir]');
    if (ouvir) { ler(ouvir.dataset.ouvir); return; }

    // Caixa "Faltou hoje": atualiza só o resumo da chamada, sem redesenhar a tabela (não perde notas já digitadas).
    var caixa = e.target.closest('[data-faltou]');
    if (caixa && main.contains(caixa)) {
      if (caixa.checked) ausentes[caixa.dataset.faltou] = true; else delete ausentes[caixa.dataset.faltou];
      var nAus = alunosTurma().filter(function (a) { return ausentes[a.id]; }).length;
      var resumo = document.getElementById('chamada-resumo');
      if (resumo) resumo.textContent = (alunosTurma().length - nAus) + (alunosTurma().length - nAus === 1 ? ' presente' : ' presentes') + ' · ' + nAus + (nAus === 1 ? ' falta' : ' faltas');
      var registrar = document.getElementById('btn-frequencia');
      if (registrar) registrar.textContent = nAus ? 'Registrar chamada com ' + nAus + (nAus === 1 ? ' falta' : ' faltas') : 'Registrar chamada: todos presentes';
      return;
    }

    var b = e.target.closest('button');
    if (!b || !main.contains(b)) return;

    if (b.dataset.reiniciar !== undefined) {
      confirmar('Restaurar os dados de demonstração?', 'Apaga as notas, a chamada e as confirmações feitas neste protótipo. Os dados voltam ao início.', 'Restaurar dados', true).then(function (sim) {
        if (!sim) return;
        dados = copia(BASE); dados.chamadaFeita = null; guardar(); desenhar(); avisar('Dados de demonstração restaurados.');
      });
      return;
    }
    if (b.id === 'btn-historico') avisar('Pedido de histórico escolar enviado. A secretaria vai emitir o documento.');

    if (b.id === 'btn-frequencia') {
      var faltosos = alunosTurma().filter(function (a) { return ausentes[a.id]; });
      var texto = faltosos.length ? 'Vai somar 1 falta para: ' + faltosos.map(function (a) { return a.nome; }).join(', ') + '. Depois de registrada, a chamada de hoje não pode ser refeita.' : 'Todos presentes. Depois de registrada, a chamada de hoje não pode ser refeita.';
      confirmar('Registrar a chamada de hoje?', texto, 'Registrar chamada').then(function (sim) {
        if (!sim) return;
        faltosos.forEach(function (a) { a.faltas += 1; });
        dados.chamadaFeita = { data: hojeISO(), ausentes: faltosos.map(function (a) { return a.id; }) };
        ausentes = {};
        guardar(); desenhar(); avisar('Chamada registrada em ' + turma().nome + ': ' + (faltosos.length === 0 ? 'todos presentes' : faltosos.length + (faltosos.length === 1 ? ' falta lançada' : ' faltas lançadas')) + '.');
      });
    }
    if (b.id === 'btn-notas') {
      erroNotas = validarNotas();
      if (erroNotas) {
        desenhar();
        main.querySelector('#nota-' + erroNotas.id).focus();
        return;
      }
      main.querySelectorAll('[data-nota]').forEach(function (c) {
        if (c.value.trim() === '') return;
        alunosTurma().forEach(function (a) { if (a.id === c.dataset.nota) a.n2 = Math.round(Number(c.value.replace(',', '.')) * 10) / 10; });
      });
      guardar(); desenhar();
      avisar('Notas do ' + dados.letivo.bimestresLancados + 'º bimestre salvas: ' + alunosTurma().length + ' estudantes. Já aparecem no boletim da família.');
    }

    if (b.dataset.filtro) { filtro = b.dataset.filtro; recusando = null; desenhar(); }
    if (b.dataset.confirmar) {
      var alvoPedido = dados.pedidos.filter(function (p) { return p.protocolo === b.dataset.confirmar; })[0];
      confirmar('Confirmar a matrícula?', alvoPedido.estudante + ' passa a ser aluno(a) da escola na ' + alvoPedido.serie + ', e a família é avisada. A confirmação não pode ser desfeita por aqui.', 'Confirmar matrícula').then(function (sim) {
        if (!sim) return;
        alvoPedido.situacao = 'Confirmada'; guardar(); desenhar(); avisar('Matrícula confirmada.');
      });
    }
    if (b.dataset.recusar) {
      recusando = b.dataset.recusar; erroRecusa = ''; desenhar();
      main.querySelector('#motivo').focus();
    }
    if ('cancelarRecusa' in b.dataset) {
      var anterior = recusando; recusando = null; desenhar();
      var volta = main.querySelector('[data-recusar="' + anterior + '"]');
      if (volta) volta.focus();
    }
    if (b.dataset.confirmarRecusa) {
      var motivo = main.querySelector('#motivo').value.trim();
      if (motivo.length < 5) {
        erroRecusa = 'Escreva o motivo com pelo menos 5 caracteres. A família verá este texto.';
        desenhar(); main.querySelector('#motivo').focus(); return;
      }
      dados.pedidos.forEach(function (p) { if (p.protocolo === b.dataset.confirmarRecusa) { p.situacao = 'Recusada'; p.motivo = motivo; } });
      recusando = null; erroRecusa = '';
      guardar(); desenhar(); avisar('Matrícula recusada. A família será avisada.');
    }
    if (b.dataset.relatorio) avisar('O relatório “' + b.dataset.relatorio + '” ainda não existe no protótipo.', 'info');
  });

  // Limpa o aviso de erro assim que a pessoa corrige o campo.
  main.addEventListener('input', function (e) {
    if (!e.target.dataset || !e.target.dataset.nota) return;
    if (erroNotas && erroNotas.id === e.target.dataset.nota) { e.target.removeAttribute('aria-invalid'); }
  });

  desenhar(false);
})();
</script>
</body>
</html>
